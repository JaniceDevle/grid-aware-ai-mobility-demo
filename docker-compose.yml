services:
  edge:
    build: .
    command: uvicorn app.edge_node:app --host 0.0.0.0 --port 8001
    ports: ["8001:8001"]
  cloud:
    build: .
    command: uvicorn app.cloud_node:app --host 0.0.0.0 --port 8002
    ports: ["8002:8002"]
  middleware:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on: [edge, cloud]
    environment:
      EDGE_URL: http://edge:8001
      CLOUD_URL: http://cloud:8002
